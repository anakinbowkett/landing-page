<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Montura Learn — Draw</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --accent: #1d7fe2;
    --pen-black: #1c1c1e;
    --pen-red: #e0344c;
    --pen-blue: #1d7fe2;
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background: #ffffff;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }

  #app {
    position: fixed;
    inset: 0;
  }

  /* ---------- Mode select (shown once, at the start of the question) ---------- */

  #mode-select {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
  }

  .mode-panel {
    flex: 1;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }

  #pick-sketch { background: #f8fafc; }
  #pick-write { background: #fdfdfd; border-left: 1px solid #e5e7eb; }

  .mode-panel:active { background: #eff6ff; }

  .mode-doodle-icon {
    width: 30px;
    height: 30px;
    opacity: 0.55;
    position: absolute;
  }

  .mode-label {
    font-size: 17px;
    font-weight: 700;
    color: #111827;
    z-index: 1;
  }

  .mode-sub {
    font-size: 12.5px;
    font-weight: 500;
    color: #6b7280;
    z-index: 1;
  }

  .ruled-line-preview {
    width: 60%;
    height: 1.5px;
    background: #cbd5e1;
  }

  /* ---------- Swipe strip: switches Sketch <-> Write once a mode is picked ---------- */

  #swipe-strip {
    position: absolute;
    top: max(10px, var(--safe-t));
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    touch-action: none;
  }

  #swipe-strip.visible { display: flex; }

  .swipe-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d1d5db;
    transition: background 150ms ease, transform 150ms ease;
  }

  .swipe-dot.active {
    background: var(--accent);
    transform: scale(1.25);
  }

  /* ---------- Mode views ---------- */

  .mode-view {
    position: absolute;
    inset: 0;
    display: none;
  }

  .mode-view.active { display: block; }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }

  #diagram-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #draw-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #diagram-placeholder-label {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #c7cdd6;
    pointer-events: none;
  }

  /* ---------- Write Space ---------- */

  #write-stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px max(90px, calc(90px + var(--safe-r))) 20px max(20px, var(--safe-l));
  }

  #write-options-list {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .write-option-btn {
    width: 100%;
    min-height: 54px;
    border: 1.5px solid #e5e7eb;
    border-radius: 14px;
    background: #ffffff;
    color: #111827;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 12px 18px;
    transition: border-color 150ms ease, background 150ms ease, transform 100ms ease;
  }

  .write-option-btn:active { transform: scale(0.98); }

  .write-option-btn.selected {
    border-color: var(--accent);
    background: #eff6ff;
    color: var(--accent);
  }

  #write-lines-canvas-wrap {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(to bottom, transparent, transparent 43px, #dbe3ee 44px);
  }

  #write-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ---------- Compact tool cluster (bottom-right, pops out on tap) ---------- */

  #tool-cluster {
    position: absolute;
    right: max(16px, var(--safe-r));
    bottom: max(16px, var(--safe-b));
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #tool-tray {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-width 220ms ease, opacity 180ms ease;
  }

  #tool-tray.open {
    max-width: 320px;
    opacity: 1;
  }

  .tool-btn {
    position: relative;
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    min-width: 44px;
    min-height: 44px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), inset 0 0 0 1.5px rgba(0, 0, 0, 0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }

  .tool-btn:active { transform: scale(0.92); }

  .tool-btn.selected {
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 0 0 2.5px var(--sel-color, var(--accent));
    transform: scale(1.06);
  }

  .pen-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
  }

  .tool-btn[data-tool="black"] .pen-dot { background: var(--pen-black); }
  .tool-btn[data-tool="red"] .pen-dot   { background: var(--pen-red); }
  .tool-btn[data-tool="blue"] .pen-dot  { background: var(--pen-blue); }

  .tool-btn[data-tool="eraser"] svg,
  .tool-btn[data-tool="clear"] svg {
    width: 19px;
    height: 19px;
    stroke: #4b5563;
  }

  .tool-btn[data-tool="clear"].confirming {
    background: var(--pen-red);
  }

  .tool-btn[data-tool="clear"].confirming svg { stroke: #ffffff; }

  #tools-toggle {
    flex: 0 0 auto;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    box-shadow: 0 2px 10px rgba(16, 24, 40, 0.15), inset 0 0 0 1.5px rgba(0, 0, 0, 0.07);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #tools-toggle svg { width: 21px; height: 21px; stroke: #4b5563; }
  #tools-toggle:active { transform: scale(0.93); }
  #tools-toggle.open { box-shadow: 0 2px 10px rgba(16, 24, 40, 0.15), 0 0 0 2.5px var(--accent); }

  #submit-btn {
    flex: 0 0 auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #ffffff;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(29, 127, 226, 0.4);
    transition: transform 120ms ease, opacity 150ms ease;
  }

  #submit-btn.visible { display: flex; }
  #submit-btn:disabled { opacity: 0.4; }
  #submit-btn:active:not(:disabled) { transform: scale(0.92); }
  #submit-btn svg { width: 22px; height: 22px; }

  /* ---------- Landscape lock ---------- */

  #rotate-overlay {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #0a0a0f;
    color: #ffffff;
    text-align: center;
    padding: 24px;
  }

  #rotate-overlay svg {
    width: 56px;
    height: 56px;
    stroke: #ffffff;
    animation: rotateHint 1.6s ease-in-out infinite;
  }

  @keyframes rotateHint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
  }

  #rotate-overlay p {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.75);
    max-width: 240px;
  }

  @media (orientation: portrait) {
    #rotate-overlay { display: flex; }
    #app { display: none; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="mode-select">
    <button class="mode-panel" id="pick-sketch">
      <svg class="mode-doodle-icon" style="top:18%;left:22%;transform:rotate(-12deg);" viewBox="0 0 24 24" fill="none" stroke="#1d7fe2" stroke-width="1.6"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      <svg class="mode-doodle-icon" style="bottom:22%;right:20%;transform:rotate(8deg);" viewBox="0 0 24 24" fill="none" stroke="#1d7fe2" stroke-width="1.6"><path d="M3 12c3-4 6 4 9 0s6-4 9 0" stroke-linecap="round"/></svg>
      <div class="mode-label">Sketch Space</div>
      <div class="mode-sub">Diagram &amp; working out</div>
    </button>
    <button class="mode-panel" id="pick-write">
      <div class="ruled-line-preview" style="margin-bottom:-4px;"></div>
      <div class="ruled-line-preview"></div>
      <div class="ruled-line-preview" style="margin-top:-4px;width:40%;"></div>
      <div class="mode-label" style="margin-top:10px;">Write Space</div>
      <div class="mode-sub">Your answer</div>
    </button>
  </div>

  <div id="swipe-strip">
    <span class="swipe-dot" data-mode="sketch"></span>
    <span class="swipe-dot" data-mode="write"></span>
  </div>

  <div class="mode-view" id="sketch-view">
    <div id="stage">
      <svg id="diagram-svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"></svg>
      <canvas id="draw-canvas"></canvas>
      <div id="diagram-placeholder-label">No diagram received — reconnect from desktop</div>
    </div>
  </div>

  <div class="mode-view" id="write-view">
    <div id="write-stage"></div>
  </div>

  <div id="tool-cluster">
    <div id="tool-tray">
      <button class="tool-btn selected" data-tool="black" style="--sel-color:#1c1c1e" aria-label="Black pen"><span class="pen-dot"></span></button>
      <button class="tool-btn" data-tool="red" style="--sel-color:#e0344c" aria-label="Red pen"><span class="pen-dot"></span></button>
      <button class="tool-btn" data-tool="blue" style="--sel-color:#1d7fe2" aria-label="Blue pen"><span class="pen-dot"></span></button>
      <button class="tool-btn" data-tool="eraser" aria-label="Eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13l-8.5 8.5a2 2 0 0 1-2.8 0L3 17.8a2 2 0 0 1 0-2.8L13 5"/><path d="M14 4l6 6"/><path d="M6 21h15"/></svg>
      </button>
      <button class="tool-btn" id="clear-btn" data-tool="clear" aria-label="Clear drawing">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    </div>
    <button id="tools-toggle" aria-label="Drawing tools">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
    </button>
    <button id="submit-btn" aria-label="Submit answer" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
  </div>

</div>

<div id="rotate-overlay">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="2" width="10" height="20" rx="2"/>
    <line x1="12" y1="18" x2="12.01" y2="18"/>
  </svg>
  <p>Turn your phone sideways to keep drawing</p>
</div>

<script>
  (function () {
    var SUPABASE_URL = 'https://bdoesoqpjhpxkwsjauwo.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkb2Vzb3FwamhweGt3c2phdXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0ODUzODIsImV4cCI6MjA4MTA2MTM4Mn0.R2fgp-wqasPtn86gVcoM2RPpSMc-66_77F6VX-DzG-s';
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var params = new URLSearchParams(window.location.search);

    // Reaching this page without ?lecture=&q= means it wasn't opened through
    // the pairing handshake (e.g. a stale Home Screen bookmark pointing
    // straight at draw.html) — send it through pairing.html instead, since
    // that's what actually tells the desktop the phone is here.
    if (!params.has('q') || !params.has('lecture')) {
      window.location.href = 'pairing.html';
      return;
    }

    var qnum = parseInt(params.get('q'), 10) || 1;
    var lectureSlug = params.get('lecture') || '';
    var channel = null;
    var channelSubscribed = false;

    function goToQuestion(newLectureSlug, newQnum, diagramSvg, answerOptionsHtml) {
      try {
        sessionStorage.setItem('mp-diagram-svg', diagramSvg || '');
        sessionStorage.setItem('mp-answer-options', answerOptionsHtml || '');
      } catch (e) {}
      var p = new URLSearchParams({ lecture: newLectureSlug, q: newQnum });
      window.location.href = 'draw.html?' + p.toString();
    }

    (async function initSync() {
      var sessionResult = await sb.auth.getSession();
      var session = sessionResult.data && sessionResult.data.session;
      if (!session) {
        window.location.href = 'login.html';
        return;
      }
      channel = sb.channel('montura-pair-' + session.user.id);

      channel.on('broadcast', { event: 'answer_select' }, function (msg) {
        var p = msg.payload || {};
        if (p.qnum === qnum) applyRemoteSelect(p.index);
      });

      // A fresh lecture page on desktop is a brand new connection that has
      // no idea the phone already paired earlier — it still needs to hear
      // phone_opened to find us, and getting a pair_ack for a different
      // question here means the student moved on, so just follow along.
      channel.on('broadcast', { event: 'pair_ack' }, function (msg) {
        var p = msg.payload || {};
        if (p.lectureSlug !== lectureSlug || p.qnum !== qnum) {
          goToQuestion(p.lectureSlug, p.qnum, p.diagramSvg, p.answerOptionsHtml);
        } else {
          // Same question — this is just a fresh desktop page (e.g. a
          // reload) finding us again; confirm we're already here.
          channel.send({ type: 'broadcast', event: 'phone_ready', payload: {} });
        }
      });

      channel.subscribe(function (status) {
        if (status !== 'SUBSCRIBED') return;
        channelSubscribed = true;
        setInterval(function () {
          channel.send({ type: 'broadcast', event: 'phone_opened', payload: {} });
        }, 1200);
      });
    })();

    function broadcast(event, payload) {
      if (!channel || !channelSubscribed) return;
      channel.send({ type: 'broadcast', event: event, payload: payload || {} });
    }

    // ---- handoff from pairing.html: same diagram + same answer options the
    // desktop question already has ----
    var diagramSvgString = '';
    var answerOptionsHtml = '';
    try {
      diagramSvgString = sessionStorage.getItem('mp-diagram-svg') || '';
      answerOptionsHtml = sessionStorage.getItem('mp-answer-options') || '';
    } catch (e) {}

    function parseViewBox(svgString) {
      var m = /viewBox\s*=\s*"([^"]+)"/i.exec(svgString || '');
      if (!m) return { w: 400, h: 300 };
      var parts = m[1].trim().split(/\s+/).map(Number);
      return { w: parts[2] || 400, h: parts[3] || 300 };
    }

    var diagramViewBox = parseViewBox(diagramSvgString);

    if (diagramSvgString) {
      var oldSvg = document.getElementById('diagram-svg');
      var wrapper = document.createElement('div');
      wrapper.innerHTML = diagramSvgString;
      var newSvg = wrapper.firstChild;
      newSvg.id = 'diagram-svg';
      newSvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      oldSvg.replaceWith(newSvg);
      document.getElementById('diagram-placeholder-label').style.display = 'none';
    }

    var optionTexts = [];
    if (answerOptionsHtml) {
      var tmp = document.createElement('div');
      tmp.innerHTML = answerOptionsHtml;
      optionTexts = Array.prototype.map.call(tmp.querySelectorAll('button'), function (b) {
        return b.textContent.trim();
      });
    }
    var hasFixedOptions = optionTexts.length > 0;

    // ============ Sketch Space: diagram + free drawing, mirrors live ============

    var canvas = document.getElementById('draw-canvas');
    var ctx = canvas.getContext('2d');
    var stage = document.getElementById('stage');
    var currentTool = 'black';
    var drawing = false;
    var lastX = 0, lastY = 0;

    var penColors = { black: '#1c1c1e', red: '#e0344c', blue: '#1d7fe2' };
    var penWidth = 3.5;
    var eraserWidth = 26;
    var lastBroadcastAt = 0;

    function toViewBoxPoint(px, py, rectEl) {
      var rect = rectEl.getBoundingClientRect();
      var scale = Math.min(rect.width / diagramViewBox.w, rect.height / diagramViewBox.h) || 1;
      var offsetX = (rect.width - diagramViewBox.w * scale) / 2;
      var offsetY = (rect.height - diagramViewBox.h * scale) / 2;
      return { x: (px - offsetX) / scale, y: (py - offsetY) / scale };
    }

    function resizeCanvas() {
      var dpr = window.devicePixelRatio || 1;
      var rect = stage.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function pointFromEvent(e, canvasEl) {
      var rect = canvasEl.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function startStroke(e) {
      if (currentTool === 'clear') return;
      drawing = true;
      var p = pointFromEvent(e, canvas);
      lastX = p.x;
      lastY = p.y;
      canvas.setPointerCapture(e.pointerId);

      broadcast('stroke_start', {
        color: penColors[currentTool] || penColors.black,
        width: currentTool === 'eraser' ? eraserWidth : penWidth,
        erase: currentTool === 'eraser'
      });
      broadcast('stroke_point', toViewBoxPoint(p.x, p.y, canvas));
      lastBroadcastAt = Date.now();
    }

    function moveStroke(e) {
      if (!drawing) return;
      var p = pointFromEvent(e, canvas);

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);

      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = eraserWidth;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = penColors[currentTool] || penColors.black;
        ctx.lineWidth = penWidth;
      }
      ctx.stroke();

      lastX = p.x;
      lastY = p.y;

      var now = Date.now();
      if (now - lastBroadcastAt >= 40) {
        broadcast('stroke_point', toViewBoxPoint(p.x, p.y, canvas));
        lastBroadcastAt = now;
      }
    }

    function endStroke() {
      if (!drawing) return;
      drawing = false;
      broadcast('stroke_end', {});
    }

    canvas.addEventListener('pointerdown', startStroke);
    canvas.addEventListener('pointermove', moveStroke);
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    var toolButtons = document.querySelectorAll('.tool-btn[data-tool]');
    var clearBtn = document.getElementById('clear-btn');
    var clearConfirmTimeout = null;

    toolButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var tool = btn.getAttribute('data-tool');

        if (tool === 'clear') {
          if (btn.classList.contains('confirming')) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            broadcast('clear_canvas', {});
            btn.classList.remove('confirming');
            clearTimeout(clearConfirmTimeout);
          } else {
            btn.classList.add('confirming');
            clearConfirmTimeout = setTimeout(function () { btn.classList.remove('confirming'); }, 2200);
          }
          return;
        }

        clearBtn.classList.remove('confirming');
        clearTimeout(clearConfirmTimeout);

        currentTool = tool;
        toolButtons.forEach(function (b) {
          if (b.getAttribute('data-tool') !== 'clear') b.classList.remove('selected');
        });
        btn.classList.add('selected');
      });
    });

    var toolsToggle = document.getElementById('tools-toggle');
    var toolTray = document.getElementById('tool-tray');
    toolsToggle.addEventListener('click', function () {
      toolTray.classList.toggle('open');
      toolsToggle.classList.toggle('open');
    });

    // ============ Write Space: mirrored answer options OR ruled handwriting ============

    var writeStage = document.getElementById('write-stage');
    var submitBtn = document.getElementById('submit-btn');
    var selectedIndex = -1;
    var applyingRemote = false;

    function selectOption(index, fromRemote) {
      selectedIndex = index;
      writeStage.querySelectorAll('.write-option-btn').forEach(function (b, i) {
        b.classList.toggle('selected', i === index);
      });
      submitBtn.disabled = false;
      if (!fromRemote) broadcast('answer_select', { qnum: qnum, index: index });
    }

    function applyRemoteSelect(index) {
      if (index == null || index < 0) return;
      applyingRemote = true;
      selectOption(index, true);
      applyingRemote = false;
    }

    var writeCanvas = null, writeCtx = null, writeDrawing = false, writeLastX = 0, writeLastY = 0;

    function buildWriteStage() {
      if (hasFixedOptions) {
        var list = document.createElement('div');
        list.id = 'write-options-list';
        optionTexts.forEach(function (text, i) {
          var btn = document.createElement('button');
          btn.className = 'write-option-btn';
          btn.type = 'button';
          btn.textContent = text;
          btn.addEventListener('click', function () { selectOption(i, false); });
          list.appendChild(btn);
        });
        writeStage.appendChild(list);
      } else {
        var wrap = document.createElement('div');
        wrap.id = 'write-lines-canvas-wrap';
        var wc = document.createElement('canvas');
        wc.id = 'write-canvas';
        wrap.appendChild(wc);
        writeStage.appendChild(wrap);
        writeCanvas = wc;
        writeCtx = wc.getContext('2d');
        submitBtn.disabled = false;
        sizeWriteCanvas();

        wc.addEventListener('pointerdown', function (e) {
          writeDrawing = true;
          var p = pointFromEvent(e, wc);
          writeLastX = p.x; writeLastY = p.y;
          wc.setPointerCapture(e.pointerId);
        });
        wc.addEventListener('pointermove', function (e) {
          if (!writeDrawing) return;
          var p = pointFromEvent(e, wc);
          writeCtx.beginPath();
          writeCtx.moveTo(writeLastX, writeLastY);
          writeCtx.lineTo(p.x, p.y);
          writeCtx.strokeStyle = '#1c1c1e';
          writeCtx.lineWidth = 3;
          writeCtx.lineCap = 'round';
          writeCtx.stroke();
          writeLastX = p.x; writeLastY = p.y;
        });
        wc.addEventListener('pointerup', function () { writeDrawing = false; });
        wc.addEventListener('pointercancel', function () { writeDrawing = false; });
        window.addEventListener('resize', sizeWriteCanvas);
      }
    }

    function sizeWriteCanvas() {
      if (!writeCanvas) return;
      var dpr = window.devicePixelRatio || 1;
      var rect = writeCanvas.getBoundingClientRect();
      writeCanvas.width = rect.width * dpr;
      writeCanvas.height = rect.height * dpr;
      writeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    submitBtn.addEventListener('click', function () {
      if (submitBtn.disabled) return;
      submitBtn.style.transform = 'scale(0.9)';
      setTimeout(function () { submitBtn.style.transform = ''; }, 150);

      if (hasFixedOptions) {
        broadcast('answer_submit', { qnum: qnum });
      } else if (writeCanvas) {
        broadcast('submit', { qnum: qnum, imageDataUrl: writeCanvas.toDataURL('image/png') });
      }
    });

    // ============ Mode select + swipe switching ============

    var currentMode = null;
    var sketchView = document.getElementById('sketch-view');
    var writeView = document.getElementById('write-view');
    var modeSelect = document.getElementById('mode-select');
    var swipeStrip = document.getElementById('swipe-strip');

    function setMode(mode) {
      currentMode = mode;
      sketchView.classList.toggle('active', mode === 'sketch');
      writeView.classList.toggle('active', mode === 'write');
      toolsToggle.style.display = (mode === 'write' && hasFixedOptions) ? 'none' : 'flex';
      toolTray.style.display = (mode === 'write' && hasFixedOptions) ? 'none' : 'flex';
      submitBtn.classList.toggle('visible', mode === 'write');
      swipeStrip.querySelectorAll('.swipe-dot').forEach(function (d) {
        d.classList.toggle('active', d.getAttribute('data-mode') === mode);
      });
      if (mode === 'sketch') resizeCanvas();
      if (mode === 'write' && writeCanvas) sizeWriteCanvas();
    }

    function pickMode(mode) {
      modeSelect.style.display = 'none';
      swipeStrip.classList.add('visible');
      buildWriteStage();
      setMode(mode);
    }

    document.getElementById('pick-sketch').addEventListener('click', function () { pickMode('sketch'); });
    document.getElementById('pick-write').addEventListener('click', function () { pickMode('write'); });

    // Swipe only recognised starting from the top strip, so it never fights
    // with an actual drawing stroke happening lower down on the canvas.
    var swipeStartX = null;
    swipeStrip.addEventListener('pointerdown', function (e) { swipeStartX = e.clientX; });
    swipeStrip.addEventListener('pointerup', function (e) {
      if (swipeStartX == null || !currentMode) return;
      var dx = e.clientX - swipeStartX;
      swipeStartX = null;
      if (Math.abs(dx) < 40) return;
      if (dx < 0 && currentMode === 'sketch') setMode('write');
      if (dx > 0 && currentMode === 'write') setMode('sketch');
    });
  })();
</script>

</body>
</html>
