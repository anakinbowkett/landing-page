<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQA English Literature - Official Papers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="theme.css" rel="stylesheet">
    <link href="shared.css" rel="stylesheet">
    <style>
        /* ── Series badge/time — same small addendum this page already had,
           now attached to the nested series header instead of a flat card ── */
        .paper-meta { display: flex; align-items: center; gap: 10px; }
        .paper-badge {
            font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
            color: var(--accent-soft-text); background: var(--accent-soft-bg);
            padding: 4px 10px; border-radius: 999px;
        }
        .paper-time { font-size: 0.8125rem; color: #6b7280; font-weight: 500; }

        /* ── Question Paper / Mark Scheme leaf rows — same footprint as
           .lec-sub-row, plus a small "front page" document icon and an
           external-link arrow since these leave the site ── */
        .doc-icon {
            flex-shrink: 0; width: 30px; height: 38px; border-radius: 4px;
            border: 1px solid #e5e7eb; background: #fff; position: relative; overflow: hidden;
        }
        .doc-icon::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
        }
        .doc-icon.qp::before { background: #1d7fe2; }
        .doc-icon.ms::before { background: #9ca3af; }
        .doc-icon::after {
            content: ''; position: absolute; left: 6px; right: 6px; top: 14px; height: 2px;
            background: #e5e7eb; box-shadow: 0 6px 0 #e5e7eb, 0 12px 0 #e5e7eb;
        }
        .lec-sub-right .external-arrow { font-size: 0.9rem; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">Montura Learn</div>
        <a href="../../dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Dashboard</span></a>
        <a href="lectures.html" class="nav-item"><span class="nav-icon">∞</span><span>Lectures</span></a>
        <a href="flashtiles.html" class="nav-item"><span class="nav-icon">⚡</span><span>Flashtiles</span></a>
        <a href="quick-test.html" class="nav-item"><span class="nav-icon">🕐</span><span>Quiz</span></a>
        <a href="past-papers.html" class="nav-item active"><span class="nav-icon">📄</span><span>Past Papers</span></a>
        <div class="nav-spacer"></div>
        <button class="live-study-btn">Allow Live Study</button>
    </aside>

    <main class="main-content">
        <div class="content-wrapper compact">
            <div class="subject-header">
                <div class="subject-line-left"></div>
                <h1 class="subject-name">Official</h1>
                <div class="subject-line-right"></div>
            </div>
        </div>

        <a href="past-papers.html" class="crumb-back">← Past Papers</a>

        <section class="topics-section">
            <p style="max-width: 700px; font-size: 0.875rem; color: #6b7280; margin: 0 0 20px;">
                Real AQA papers, straight from AQA's own site — opens in a new tab. Newest series first.
            </p>
            <div class="papers-list" id="papersList"></div>
        </section>
    </main>

<script>
/* ════════════════════════════════════════════
   DATA — every entry links directly to
   filestore.aqa.org.uk. Verified live, not
   guessed. Ordered newest-first within each
   paper; that ordering is the display ordering,
   nothing is re-sorted at runtime.
════════════════════════════════════════════ */
const OFFICIAL_PAPERS = [
    {
        tag: 'Paper 1 · AQA 8702/1',
        title: 'Shakespeare and the 19th-century Novel',
        series: [
            { label: 'June 2023', time: '1h 45m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2023/june/AQA-87021-QP-JUN23.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2023/june/AQA-87021-MS-JUN23.PDF' },
            { label: 'June 2022 · 1M Modern Prose/Drama', time: '50m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2022/june/AQA-87021M-QP-JUN22.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2022/june/AQA-87021M-MS-JUN22.PDF' },
            { label: 'June 2022 · 1N 19th-century Novel', time: '50m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2022/june/AQA-87021N-QP-JUN22.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2022/june/AQA-87021N-MS-JUN22.PDF' },
            { label: 'June 2022 · 1P Poetry Anthology', time: '50m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2022/june/AQA-87021P-QP-JUN22-CR.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2022/june/AQA-87021P-MS-JUN22.PDF' },
            { label: 'Nov 2021 · 1M Modern Prose/Drama', time: '50m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2021/november/AQA-87021M-QP-NOV21.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2021/november/AQA-87021M-MS-NOV21.PDF' },
            { label: 'Nov 2021 · 1N 19th-century Novel', time: '50m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2021/november/AQA-87021N-QP-NOV21.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2021/november/AQA-87021N-MS-NOV21.PDF' },
            { label: 'Nov 2021 · 1P Poetry Anthology', time: '50m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2021/november/AQA-87021P-QP-NOV21.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2021/november/AQA-87021P-MS-NOV21.PDF' },
            { label: 'Nov 2020', time: '1h 45m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2020/november/AQA-87021-QP-NOV20.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2020/november/AQA-87021-W-MS-NOV20.PDF' },
            { label: 'Specimen', time: '1h 45m',
              qp: 'http://filestore.aqa.org.uk/resources/english/AQA-87021-SQP-V1.PDF',
              ms: 'http://filestore.aqa.org.uk/resources/english/AQA-87021-SMS.PDF' }
        ]
    },
    {
        tag: 'Paper 2 · AQA 8702/2',
        title: 'Modern Texts and Poetry',
        series: [
            { label: 'June 2023', time: '2h 15m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2023/june/AQA-87022-QP-JUN23-CR.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2023/june/AQA-87022-MS-JUN23.PDF' },
            { label: 'June 2022', time: '2h 15m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2022/june/AQA-87022-QP-JUN22.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2022/june/AQA-87022-MS-JUN22.PDF' },
            { label: 'Nov 2021', time: '2h 15m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2021/november/AQA-87022-QP-NOV21.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2021/november/AQA-87022-MS-NOV21.PDF' },
            { label: 'Nov 2020', time: '2h 15m',
              qp: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2020/november/AQA-87022-QP-NOV20-CR.PDF',
              ms: 'https://filestore.aqa.org.uk/sample-papers-and-mark-schemes/2020/november/AQA-87022-W-MS-NOV20.PDF' },
            { label: 'Specimen', time: '2h 15m',
              qp: 'http://filestore.aqa.org.uk/resources/english/AQA-87022-SQP.PDF',
              ms: 'http://filestore.aqa.org.uk/resources/english/AQA-87022-SMS.PDF' }
        ]
    }
];

/* ════════════════════════════════════════════
   BUILD UI — same accordion nesting as
   lectures.html: paper-item > lec-pillar-box
   (one per series) > lec-sub-row (QP, then MS)
════════════════════════════════════════════ */
const list = document.getElementById('papersList');

OFFICIAL_PAPERS.forEach(paper => {
    const item = document.createElement('div');
    item.className = 'paper-item';

    const header = document.createElement('button');
    header.className = 'paper-header';
    header.innerHTML = `
        <div class="paper-header-left">
            <span class="paper-tag">${paper.tag}</span>
            <span class="paper-title">${paper.title}</span>
        </div>
        <span class="paper-chevron">›</span>`;
    header.addEventListener('click', () => item.classList.toggle('open'));

    const body = document.createElement('div');
    body.className = 'paper-body';

    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'subject-cards';

    const panel = document.createElement('div');
    panel.className = 'lec-panel';
    panel.style.padding = '0';

    const pillarsDiv = document.createElement('div');
    pillarsDiv.className = 'lec-pillars';
    pillarsDiv.style.padding = '16px';

    paper.series.forEach(s => {
        const box = document.createElement('div');
        box.className = 'lec-pillar-box';

        const hdr = document.createElement('div');
        hdr.className = 'lec-pillar-header';
        hdr.innerHTML = `
            <div class="lec-pillar-header-left">
                <span class="lec-pillar-name">${s.label}</span>
            </div>
            <div class="lec-pillar-header-right">
                <div class="paper-meta">
                    <span class="paper-badge">Official</span>
                    <span class="paper-time">${s.time}</span>
                </div>
                <span class="lec-pillar-chevron">›</span>
            </div>`;
        hdr.addEventListener('click', e => { e.stopPropagation(); box.classList.toggle('open'); });

        const bdy = document.createElement('div');
        bdy.className = 'lec-pillar-body';

        const rows = [
            { kind: 'qp', name: 'Question Paper', url: s.qp },
            { kind: 'ms', name: 'Mark Scheme', url: s.ms }
        ];
        rows.forEach(r => {
            const row = document.createElement('a');
            row.className = 'lec-sub-row';
            row.href = r.url;
            row.target = '_blank';
            row.rel = 'noopener noreferrer';
            row.innerHTML = `
                <div class="lec-sub-left">
                    <span class="doc-icon ${r.kind}"></span>
                    <span class="lec-sub-name">${r.name}</span>
                </div>
                <div class="lec-sub-right">
                    <span class="external-arrow">↗</span>
                </div>`;
            bdy.appendChild(row);
        });

        box.appendChild(hdr); box.appendChild(bdy);
        pillarsDiv.appendChild(box);
    });

    panel.appendChild(pillarsDiv);
    cardsWrap.appendChild(panel);
    body.appendChild(cardsWrap);

    item.appendChild(header);
    item.appendChild(body);
    list.appendChild(item);
});
</script>
</body>
</html>
